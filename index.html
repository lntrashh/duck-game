<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Caça aos Patos 2.0 - Arcade com Ranking</title>
<style>
  /* --- VISUAL DO JOGO --- */
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  
  body { 
    background: linear-gradient(to bottom, #87CEEB 0%, #a2dffa 100%); 
    overflow: hidden; 
    height: 100vh; 
    width: 100vw; 
    cursor: crosshair; 
    font-family: 'Arial', sans-serif;
  }

  /* --- SISTEMA DE DIA E NOITE --- */
  #ceu-noite {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, #020111 0%, #20124d 100%);
    opacity: 0; 
    transition: opacity 3s ease-in-out; 
    pointer-events: none;
    z-index: 1; 
  }

  .estrela {
    position: absolute;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 5px white;
  }

  #chao {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 15vh;
    background: #228B22;
    border-top: 5px solid #006400;
    z-index: 10;
    transition: filter 3s; 
  }

  #hud { 
    position: absolute; 
    top: 20px; 
    left: 20px; 
    font-size: 28px; 
    font-weight: bold; 
    color: white;
    text-shadow: 2px 2px 0px #000;
    pointer-events: none; 
    z-index: 20; 
  }
  
  #tempo { color: #FF4500; }

  /* --- O PATO ANIMADO --- */
  .pato {
    position: absolute;
    width: 90px;
    height: 90px;
    cursor: crosshair;
    z-index: 5;
    transition: transform 0.1s;
  }

  @keyframes baterAsa {
    0% { transform: scaleY(1); }
    50% { transform: scaleY(-1); }
    100% { transform: scaleY(1); }
  }
  .asa {
    transform-origin: center;
    animation: baterAsa 0.15s infinite;
  }

  .morto {
    transform: scaleY(-1) translateY(-20px);
    pointer-events: none;
    filter: grayscale(100%);
  }

  /* --- A ESPINGARDA E A BALA --- */
  #arma-container {
    position: absolute;
    bottom: -10px;
    left: 50%;
    width: 30px;
    height: 180px;
    margin-left: -15px;
    transform-origin: bottom center;
    pointer-events: none;
    z-index: 40;
    transition: transform 0.05s linear;
  }

  #cano {
    width: 12px;
    height: 120px;
    background: linear-gradient(to right, #444, #777, #444);
    margin: 0 auto;
    border-radius: 5px 5px 0 0;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
  }

  #coronha {
    width: 30px;
    height: 60px;
    background: #5c3a21;
    border-radius: 0 0 10px 10px;
    box-shadow: inset -3px 0 5px rgba(0,0,0,0.5);
  }

  .bala {
    position: absolute;
    width: 6px;
    height: 25px;
    background: #FFF8DC;
    box-shadow: 0 0 10px #FFA500, 0 0 20px #FF4500;
    border-radius: 3px;
    pointer-events: none;
    z-index: 35;
    transition: all 0.1s ease-out; 
    opacity: 1;
  }

  /* --- TELAS E MENUS --- */
  #tela-overlay { 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
    position: absolute; 
    top: 0; left: 0; width: 100%; height: 100%; 
    background: rgba(0, 0, 0, 0.85); 
    z-index: 50; 
    color: white;
    padding: 20px;
  }
  
  .escondido { display: none !important; }
  
  #tela-overlay h1 { font-size: 50px; color: #FFD700; margin-bottom: 15px; text-shadow: 3px 3px 0 #D2691E; text-align: center; }
  #texto-pontuacao { font-size: 24px; margin-bottom: 15px; text-align: center; }
  #pontuacao-final { color: #00FF00; font-size: 35px; font-weight: bold;}
  
  /* Formulario do Nome */
  #form-salvar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  input[type="text"] {
    padding: 12px 15px;
    font-size: 18px;
    border: 2px solid #FFD700;
    border-radius: 8px;
    outline: none;
    background: #222;
    color: white;
    text-align: center;
  }

  button { 
    padding: 12px 30px; 
    font-size: 20px; 
    font-weight: bold; 
    color: white; 
    background: #FF4500; 
    border: 3px solid #FFF; 
    border-radius: 8px; 
    cursor: pointer; 
    transition: 0.2s; 
  }
  button:hover { background: #FF0000; transform: scale(1.05); }

  /* Tabela de Ranking */
  #container-ranking {
    width: 100%;
    max-width: 450px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid #FFD700;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 20px;
    max-height: 250px;
    overflow-y: auto;
  }

  #container-ranking h3 {
    text-align: center;
    color: #FFD700;
    margin-bottom: 10px;
    font-size: 22px;
  }

  .tabela-ranking {
    width: 100%;
    border-collapse: collapse;
    font-size: 18px;
  }

  .tabela-ranking th, .tabela-ranking td {
    padding: 8px 12px;
    text-align: left;
  }

  .tabela-ranking th {
    color: #00FFFF;
    border-bottom: 2px solid #555;
  }

  .tabela-ranking tr:nth-child(even) {
    background: rgba(255, 255, 255, 0.05);
  }

  .tabela-ranking tr:first-child td {
    color: #FFD700; 
    font-weight: bold;
  }

  .tabela-ranking tr:nth-child(2) td {
    color: #C0C0C0; 
    font-weight: bold;
  }

  .tabela-ranking tr:nth-child(3) td {
    color: #CD7F32; 
    font-weight: bold;
  }
</style>
</head>
<body>

  <div id="ceu-noite"></div>

  <div id="hud">
    Patos Abatidos: <span id="pontuacao">0</span> <br>
    Tempo: <span id="tempo">90</span>s
  </div>

  <div id="chao"></div>
  
  <div id="arma-container">
    <div id="cano"></div>
    <div id="coronha"></div>
  </div>

  <div id="tela-overlay">
    <h1 id="titulo-tela">CAÇA AOS PATOS 🦆</h1>
    
    <div id="texto-pontuacao" class="escondido">
      Sua Pontuação: <span id="pontuacao-final">0</span> pts
    </div>

    <div id="form-salvar" class="escondido">
      <input type="text" id="nome-jogador" placeholder="Seu Nome / Apelido" maxlength="12">
      <button id="btn-salvar" onclick="salvarPontuacao()">Salvar</button>
    </div>

    <div id="container-ranking" class="escondido">
      <h3>🏆 TOP 10 CAÇADORES 🏆</h3>
      <table class="tabela-ranking">
        <thead>
          <tr>
            <th>#</th>
            <th>Nome</th>
            <th>Pontos</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela-ranking">
          </tbody>
      </table>
    </div>

    <button id="btn-iniciar" onclick="window.iniciarJogo()">Preparar Espingarda!</button>
  </div>

  <script>
    let pontos = 0;
    let tempoRestante = 90; 
    let intervaloTempo;
    let intervaloPatos;
    let intervaloDiaNoite; 
    let jogoRodando = false;
    let ehDia = true;

    const elPontuacao = document.getElementById('pontuacao');
    const elTempo = document.getElementById('tempo');
    const telaOverlay = document.getElementById('tela-overlay');
    const btnIniciar = document.getElementById('btn-iniciar');
    const arma = document.getElementById('arma-container');
    const ceuNoite = document.getElementById('ceu-noite');
    const chao = document.getElementById('chao');
    const formSalvar = document.getElementById('form-salvar');
    const containerRanking = document.getElementById('container-ranking');
    const corpoTabelaRanking = document.getElementById('corpo-tabela-ranking');
    const inputNome = document.getElementById('nome-jogador');

    // Estrelas da Noite (Garantindo que o DOM carregou)
    window.onload = function() {
      for(let i = 0; i < 30; i++) {
        let estrela = document.createElement('div');
        estrela.className = 'estrela';
        estrela.style.width = Math.random() * 3 + 'px';
        estrela.style.height = estrela.style.width;
        estrela.style.left = Math.random() * 100 + '%';
        estrela.style.top = Math.random() * 80 + '%';
        ceuNoite.appendChild(estrela);
      }
    };

    // MIRA DA ESPINGARDA
    document.addEventListener('mousemove', (e) => {
      const baseArmaX = window.innerWidth / 2;
      const baseArmaY = window.innerHeight;
      const deltaX = e.clientX - baseArmaX;
      const deltaY = e.clientY - baseArmaY;
      let angulo = Math.atan2(deltaY, deltaX) * (180 / Math.PI) + 90;
      
      if (angulo < -80) angulo = -80;
      if (angulo > 80) angulo = 80;

      arma.style.transform = `rotate(${angulo}deg)`;
    });

    // SISTEMA DE TIRO
    document.body.addEventListener('mousedown', function(event) {
      if (!jogoRodando || event.target.tagName === 'BUTTON' || event.target.tagName === 'INPUT') return;

      const bala = document.createElement('div');
      bala.className = 'bala';
      
      bala.style.left = (window.innerWidth / 2) + 'px';
      bala.style.top = (window.innerHeight - 50) + 'px';
      document.body.appendChild(bala);

      bala.getBoundingClientRect();

      bala.style.left = event.clientX + 'px';
      bala.style.top = event.clientY + 'px';
      bala.style.opacity = '0'; 
      bala.style.transform = arma.style.transform; 

      setTimeout(() => bala.remove(), 100);

      if (!event.target.closest('.pato') && event.target.id !== 'chao' && event.target.id !== 'hud') {
        pontos = Math.max(0, pontos - 1); 
        elPontuacao.innerText = pontos;
      }
    });

    // INICIAR O JOGO
    window.iniciarJogo = function() {
      pontos = 0;
      tempoRestante = 90; 
      jogoRodando = true;
      ehDia = true; 
      
      elPontuacao.innerText = pontos;
      elTempo.innerText = tempoRestante;
      telaOverlay.classList.add('escondido'); 
      
      ceuNoite.style.opacity = '0';
      chao.style.filter = 'brightness(1)';
      
      clearInterval(intervaloTempo);
      clearInterval(intervaloPatos);
      clearInterval(intervaloDiaNoite);
      
      intervaloTempo = setInterval(() => {
        tempoRestante--;
        elTempo.innerText = tempoRestante;
        if (tempoRestante <= 0) finalizarJogo();
      }, 1000);

      intervaloPatos = setInterval(criarPato, 800); 

      // Ciclo de Dia e Noite
      intervaloDiaNoite = setInterval(() => {
        ehDia = !ehDia;
        if(ehDia) {
          ceuNoite.style.opacity = '0';
          chao.style.filter = 'brightness(1)';
        } else {
          ceuNoite.style.opacity = '1';
          chao.style.filter = 'brightness(0.3)';
        }
      }, 25000); 
    };

    // CRIAR O PATO 
    function criarPato() {
      if (!jogoRodando) return;

      const pato = document.createElement('div');
      pato.className = 'pato';
      
      pato.innerHTML = `
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <ellipse class="asa" cx="45" cy="40" rx="15" ry="25" fill="#5c3a21" />
          <ellipse cx="50" cy="60" rx="35" ry="20" fill="#8B4513" />
          <rect x="70" y="35" width="12" height="25" fill="#2E8B57" />
          <circle cx="76" cy="35" r="14" fill="#2E8B57" />
          <polygon points="88,32 100,32 100,38 85,38" fill="#FFA500" />
          <circle cx="80" cy="32" r="2" fill="white" />
          <circle cx="81" cy="32" r="1" fill="black" />
          <ellipse class="asa" cx="45" cy="50" rx="20" ry="12" fill="#A0522D" />
        </svg>
      `;

      const vindoDaEsquerda = Math.random() > 0.5;
      let posX = vindoDaEsquerda ? -100 : window.innerWidth + 100;
      let posY = Math.random() * (window.innerHeight - 300) + 50; 
      
      pato.style.left = posX + 'px';
      pato.style.top = posY + 'px';
      
      if (!vindoDaEsquerda) {
        pato.querySelector('svg').style.transform = 'scaleX(-1)';
      }

      pato.addEventListener('mousedown', function(event) {
        if (pato.classList.contains('morto')) return;
        event.stopPropagation(); 

        pontos += 5; 
        elPontuacao.innerText = pontos;
        pato.classList.add('morto');
        
        pato.innerHTML = '<div style="font-size: 70px; text-align: center; line-height: 90px;">💥</div>';
        
        setTimeout(() => pato.remove(), 400); 
      });

      document.body.appendChild(pato);

      let velocidadeX = (Math.random() * 4 + 3) * (vindoDaEsquerda ? 1 : -1);
      let velocidadeY = (Math.random() - 0.5) * 3; 

      function moverPato() {
        if (!jogoRodando || pato.classList.contains('morto')) return;

        posX += velocidadeX;
        posY += velocidadeY;
        
        pato.style.left = posX + 'px';
        pato.style.top = posY + 'px';

        if (posY < 10 || posY > window.innerHeight - 250) velocidadeY *= -1;

        if (posX > window.innerWidth + 150 || posX < -150) {
          pato.remove();
        } else {
          requestAnimationFrame(moverPato);
        }
      }
      requestAnimationFrame(moverPato);
    }

    // FIM DE JOGO
    function finalizarJogo() {
      jogoRodando = false;
      clearInterval(intervaloTempo);
      clearInterval(intervaloPatos);
      clearInterval(intervaloDiaNoite);
      
      document.querySelectorAll('.pato').forEach(p => p.remove());
      
      document.getElementById('pontuacao-final').innerText = pontos;
      document.getElementById('titulo-tela').innerText = "FIM DA CAÇADA!";
      document.getElementById('texto-pontuacao').classList.remove('escondido');
      
      formSalvar.classList.remove('escondido');
      inputNome.value = '';
      
      atualizarTabelaRanking();
      containerRanking.classList.remove('escondido');

      btnIniciar.innerText = "Caçar Novamente";
      telaOverlay.classList.remove('escondido');
    }

    // SISTEMA DE RANKING (LOCALSTORAGE)
    function obterRanking() {
      return JSON.parse(localStorage.getItem('caca_patos_ranking') || '[]');
    }

    function salvarPontuacao() {
      const nome = inputNome.value.trim() || 'Anônimo';
      let ranking = obterRanking();

      ranking.push({ nome: nome, pontos: pontos });
      ranking.sort((a, b) => b.pontos - a.pontos);
      ranking = ranking.slice(0, 10);

      localStorage.setItem('caca_patos_ranking', JSON.stringify(ranking));

      formSalvar.classList.add('escondido');
      atualizarTabelaRanking();
    }

    function atualizarTabelaRanking() {
      const ranking = obterRanking();
      corpoTabelaRanking.innerHTML = '';

      if (ranking.length === 0) {
        corpoTabelaRanking.innerHTML = '<tr><td colspan="3" style="text-align:center;">Nenhum registro ainda.</td></tr>';
        return;
      }

      ranking.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index + 1}º</td>
          <td>${item.nome}</td>
          <td>${item.pontos} pts</td>
        `;
        corpoTabelaRanking.appendChild(tr);
      });
    }
  </script>
</body>
</html>
