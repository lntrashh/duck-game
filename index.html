<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Caça aos Patos - Original Retro</title>
<style>
  /* --- CENÁRIO RETRO --- */
  body {
    margin: 0; padding: 0; overflow: hidden;
    background: #4682B4; /* Azul clássico escuro */
    font-family: "Courier New", monospace;
    cursor: crosshair;
    user-select: none;
  }
  
  #chao {
    position: absolute; bottom: 0; width: 100%; height: 20vh;
    background: #2E8B57; /* Verde retro */
    border-top: 10px solid #006400; z-index: 5;
  }

  /* --- HUD (PLACAR) --- */
  #hud {
    position: absolute; top: 15px; left: 15px; font-size: 28px;
    font-weight: bold; color: #FFF; text-shadow: 3px 3px 0 #000; z-index: 10;
  }
  
  #msg-alerta { color: #FF4500; font-size: 20px; display: none; }

  /* --- ARMA 100% CSS (SEM IMAGENS EXTERNAS) --- */
  #arma-container {
    position: absolute; bottom: 0; left: 50%;
    width: 30px; height: 180px; margin-left: -15px;
    transform-origin: bottom center; z-index: 20; pointer-events: none;
  }
  #cano {
    width: 16px; height: 130px; background: #555;
    margin: 0 auto; border: 3px solid #000; border-bottom: none;
  }
  #mira-ponta {
    width: 6px; height: 6px; background: red; margin: 0 auto;
    position: relative; top: -6px; border: 1px solid black;
  }
  #coronha {
    width: 30px; height: 50px; background: #A0522D; /* Marrom clássico */
    border: 3px solid #000; border-bottom: none;
  }

  /* --- PATOS --- */
  .pato {
    position: absolute; width: 70px; height: 70px; z-index: 4; cursor: crosshair;
  }
  .morto { pointer-events: none; filter: brightness(0) invert(1); } /* Fica branco ao morrer */

  /* --- TELA DE MENU --- */
  #tela-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; display: flex; flex-direction: column;
    justify-content: center; align-items: center; z-index: 100;
  }
  .escondido { display: none !important; }
  
  #titulo { color: #32CD32; font-size: 60px; text-shadow: 4px 4px #006400; margin-bottom: 10px; }
  .texto-branco { color: #FFF; font-size: 22px; margin-bottom: 30px; }
  
  button {
    padding: 15px 40px; font-size: 24px; font-weight: bold; background: #FF0000;
    color: white; border: 4px solid #FFF; cursor: pointer; font-family: "Courier New", monospace;
  }
  button:hover { background: #8B0000; }
</style>
</head>
<body>

    BALAS: <span id="mun">5</span><br>
    <div id="msg-alerta">TECLE 'R' PARA RECARREGAR</div>
  </div>

  <div id="chao"></div>
