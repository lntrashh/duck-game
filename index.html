  * { 
    margin: 0; padding: 0; box-sizing: border-box; user-select: none; 
    -webkit-user-select: none; -webkit-touch-callout: none;
  }
  
  body { 
    background: linear-gradient(to bottom, #4CA1AF, #C4E0E5);

    touch-action: none; /* Trava zoom no celular */

  #ceu-noite {

    background: linear-gradient(to bottom, #020111 0%, #20124d 100%);
    opacity: 0; transition: opacity 3s ease-in-out; pointer-events: none; z-index: 1; 
  }
  .estrela {
    position: absolute; background: white; border-radius: 50%; box-shadow: 0 0 5px white;

    transition: opacity 0.05s ease-out;

  }
