<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Caça aos Patos - Definitivo</title>
<style>
  /* --- VISUAL E TRAVA DE TELA PARA MOBILE --- */
  * { 
    margin: 0; padding: 0; box-sizing: border-box; 
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  
  body { 
    background: linear-gradient(to bottom, #4CA1AF, #C4E0E5); 
    overflow: hidden; 
    height: 100vh; width: 100vw; 
    touch-action: none; /* Bloqueia zoom e rolagem no celular */
    cursor: crosshair;
    font-family: 'Courier New', Courier, monospace; 
  }

  /* --- EFEITOS VISUAIS --- */
  #flash-tela {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: white; opacity: 0; pointer-events: none; z-index: 45;
    transition: opacity 0.05s ease-out;
  }

  .nuvem {
    position: absolute; background: rgba(255, 255, 255, 0.9);
    border-radius: 50px; z-index: 2; box-shadow: 5px 5px 15px rgba(0,0,0,0.1);
  }
  .nuvem::before, .nuvem::after {
    content: ''; position: absolute; background: rgba(255, 255, 255, 0.9); border-radius: 50%;
  }

  #chao {
    position: absolute; bottom: 0; width: 100%; height: 15vh;
    background: linear-gradient(to top, #114B11, #228B22);
    border-top: 8px solid #005000; z-index: 10;
  }

  /* --- HUD (Textos e Munição) --- */
  #hud { 
    position: absolute; top: 15px; left: 20px; font-size: 24px; font-weight: bold; 
    color: white; text-shadow: 2px 2px 0px #000; pointer-events: none; z-index: 20; 
  }
  #tempo { color: #FF4500; }
  #nivel-ui { color: #FFD700; }
  
  /* Botão de recarregar no Mobile */
  #hud-municao {
    position: absolute; bottom: 20px; right: 20px; font-size: 35px; font-weight: bold;
    color: #FFD700; text-shadow: 2px 2px 0px #000; z-index: 50; 
    text-align: right; background: rgba(0, 0, 0, 0.5); padding: 10px 15px;
    border-radius: 10px; border: 2px solid #FFF; cursor: pointer;
  }
  #hud-municao:active { background: rgba(0, 0, 0, 0.8); transform: scale(0.95); }
  #alerta-recarregar {
    color: red; font-size: 16px; animation: piscar 0.5s infinite; text-align: center;
  }
  @keyframes piscar { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

  /* --- PATOS --- */
  .pato {
    position: absolute; width: 100px; height: 100px; z-index: 5;
    transition: transform 0.1s; filter: drop-shadow(3px 5px 4px rgba(0,0,0,0.3));
    /* AQUI: Liberamos o toque direto neles */
    pointer-events: auto; 
    cursor: crosshair;
  }

  @keyframes baterAsa { 0% { transform: scaleY(1); } 50% { transform: scaleY(-1) rotate(-10deg); } 100% { transform: scaleY(1); } }
  .asa { transform-origin: center; animation: baterAsa 0.15s infinite; }

  .morto {
    transform: scaleY(-1) translateY(-20px) !important;
    filter: brightness(1.5) grayscale(0.5) !important; 
    pointer-events: none;
    animation: cair 0.5s forwards ease-in;
  }
  @keyframes cair { to { top: 100vh; } }

  /* --- ARMA --- */
  #arma-container {
    position: absolute; bottom: -10px; left: 50%; width: 44px; height: 220px;
    margin-left: -22px; transform-origin: bottom center; pointer-events: none; z-index: 40;
    transition: transform 0.05s;
  }
  #cano {
    position: relative; width: 20px; height: 150px; background: #555; 
    margin: 0 auto; border: 2px solid #000; border-radius: 4px 4px 0 0;
  }
  #coronha {
    width: 44px; height: 80px; background: #8b4513; border: 2px solid #000; border-radius: 0 0 10px 10px;
  }

  /* --- MENU PRINCIPAL --- */
  #tela-overlay { 
    display: flex; flex-direction: column; justify-content: center; align-items: center; 
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
    background: rgba(0, 10, 20, 0.95); z-index: 100; color: white; padding: 20px; text-align: center;
  }
  .escondido { display: none !important; }
