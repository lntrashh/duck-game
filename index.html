<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Caça aos Patos - Final</title>
<style>
  /* --- BASE DO JOGO --- */
  * { 
    margin: 0; padding: 0; box-sizing: border-box; 
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  
  body { 
    background: linear-gradient(to bottom, #4CA1AF, #C4E0E5); 
    overflow: hidden; height: 100vh; width: 100vw; 
    touch-action: none; /* Fundamental para não bugar no telemóvel */
    cursor: crosshair; font-family: 'Courier New', Courier, monospace; 
  }

  /* --- CENÁRIO --- */
  #flash-tela {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: white; opacity: 0; pointer-events: none; z-index: 45;
    transition: opacity 0.05s ease-out;
  }

  .nuvem {
    position: absolute; background: rgba(255, 255, 255, 0.9);
    border-radius: 50px; z-index: 2;
  }
  .nuvem::before, .nuvem::after {
    content: ''; position: absolute; background: rgba(255, 255, 255, 0.9); border-radius: 50%;
  }

  #chao {
    position: absolute; bottom: 0; width: 100%; height: 15vh;
    background: linear-gradient(to top, #114B11, #228B22);
    border-top: 8px solid #005000; z-index: 10;
  }

  /* --- MENUS E INTERFACE --- */
  #hud { 
    position: absolute; top: 15px; left: 20px; font-size: 20px; font-weight: bold; 
    color: white; text-shadow: 2px 2px 0px #000; pointer-events: none; z-index: 20; 
  }
  
  #hud-municao {
    position: absolute; bottom: 20px; right: 20px; font-size: 30px; font-weight: bold;
    color: #FFD700; text-shadow: 2px 2px 0px #000; z-index: 50; 
    text-align: right; background: rgba(0, 0, 0, 0.5); padding: 10px 15px;
    border-radius: 10px; border: 2px solid #FFF; cursor: pointer;
  }
  #alerta-recarregar { color: red; font-size: 14px; text-align: center; display: none; }

  /* --- PATOS --- */
  .pato {
    position: absolute; width: 90px; height: 90px; z-index: 5;
    transition: transform 0.1s; cursor: crosshair;
  }
  .asa { transform-origin: center; animation: baterAsa 0.15s infinite; }
  @keyframes baterAsa { 0% { transform: scaleY(1); } 50% { transform: scaleY(-1); } 100% { transform: scaleY(1); } }

  .morto {
    transform: scaleY(-1) translateY(-20px) !important;
    pointer-events: none; filter: grayscale(100%);
    animation: cair 0.5s forwards ease-in;
  }
  @keyframes cair { to { top: 100vh; } }

  /* --- ARMA EM CSS --- */
  #arma-container {
    position: absolute; bottom: -10px; left: 50%; width: 40px; height: 200px;
    margin-left: -20px; transform-origin: bottom center; pointer-events: none; z-index: 40;
  }
  #cano {
    position: relative; width: 16px; height: 140px; background: #555; 
    margin: 0 auto; border: 2px solid #000; border-radius: 4px 4px 0 0;
  }
  #coronha {
    width: 40px; height: 70px; background: #8b4513; border: 2px solid #000; border-radius: 0 0 10px 10px;
  }

  /* --- TELA INICIAL --- */
  #tela-overlay { 
    display: flex; flex-direction: column; justify-content: center; align-items: center; 
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
    background: rgba(0, 10, 20, 0.95); z-index: 100; color: white; text-align: center;
  }
  .escondido { display: none !important; }
  button { 
    padding: 15px 40px; font-size: 24px; font-weight: bold; background: #FF4500; 
    color: white; border: 4px solid #FFF; border-radius: 8px; cursor: pointer; margin-top: 20px;
  }
</style>
</head>
<body>

  <div id="flash-tela"></div>

  <div class="nuvem" style="top: 15%; left: 10%; width: 120px; height: 40px;"></div>
  <div class="nuvem" style="top: 25%; left: 70%; width: 160px; height: 50px;"></div>

  <div id="hud">
    NÍVEL: <span id="nivel-ui">1</span><br>
    PONTOS: <span id="pontuacao">0</span><br>

  </div>

    <div id="coronha"></div>
  </div>
